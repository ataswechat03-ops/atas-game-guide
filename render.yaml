services:
  - type: web
    name: atas-game-guide-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/atas-guide.db
      - key: CORS_ORIGIN
        value: https://ataswechat03-ops.github.io
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: atas-guide-data
      mountPath: /var/data
      sizeGB: 1
