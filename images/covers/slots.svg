<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#170709"/><stop offset="1" stop-color="#6d0b08"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff6bd"/><stop offset=".28" stop-color="#ffd86b"/><stop offset=".62" stop-color="#d99a22"/><stop offset="1" stop-color="#fff1a0"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#ffd36b" stop-opacity=".95"/><stop offset="1" stop-color="#ff5b16" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/><feOffset dy="5" result="o"/><feFlood flood-color="#000" flood-opacity=".8"/><feComposite in2="o" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="neon"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
 .title{font-size:88px;font-weight:900;letter-spacing:2px;fill:url(#gold);filter:url(#shadow)}
 .sub{font-size:30px;font-weight:800;fill:#fff;letter-spacing:4px}
 .tag{font-size:20px;font-weight:800;fill:#f8e6aa;letter-spacing:2px}
 .brand{font-size:22px;font-weight:800;fill:#fbe9a7;letter-spacing:2px}
 .small{font-size:18px;font-weight:700;fill:#dbe8ff}
 .odds{font-size:52px;font-weight:900;fill:#fff}
</style>
