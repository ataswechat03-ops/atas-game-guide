<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111f">
<title>ATAS 遊戲教學中心</title>
<link rel="stylesheet" href="style.css?v=20261010c">
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div><b>ATAS</b><small>遊戲教學中心</small></div>
    </div>
    <button class="mobile-close" id="mobileClose">×</button>
    <div class="side-title">分類</div>
    <nav id="categoryNav"></nav>
    <div class="side-title">快速進入</div>
    <nav id="guideNav"></nav>
  </aside>

  <main>
    <header>
      <div class="header-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div><div class="subhead">ATAS KNOWLEDGE BASE</div><h1>遊戲教學中心</h1></div>
      </div>
    </header>

    <section class="hero">
      <span class="pill">Google Drive 教學已整合</span>
      <h2>一個網址，把教學全部集中。</h2>
      <p>電子、真人、體育基礎教學都整理在這裡。搜尋關鍵字或選擇分類，點進去就能查看完整內容。</p>
      <div class="hero-stats" id="heroStats"></div>
    </section>

    <section class="toolbar">
      <label class="search"><span>⌕</span><input id="q" placeholder="搜尋：百家樂、骰寶、LINE、WAYS、足球、輪盤…"></label>
      <div class="count" id="count"></div>
    </section>

    <div class="section-title"><div class="subhead">TUTORIAL LIBRARY</div><h2 id="sectionTitle">全部教學</h2></div>
    <section class="guide-grid" id="guideGrid"></section>
    <div class="empty" id="empty">找不到符合的教學。</div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<section class="detail" id="detail">
  <div class="detail-head">
    <div><div class="subhead" id="detailCategory"></div><h2 id="detailTitle"></h2><p id="detailIntro"></p></div>
    <button class="close" id="closeDetail">×</button>
  </div>
  <div class="detail-body" id="detailBody"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="guides.js?v=20261010c"></script>
<script src="script.js?v=20261010c"></script>
<script src="fantan-image.js?v=20261010c"></script>
<script src="training.js?v=20261010c"></script>
<script src="football-v2.js?v=20261010c"></script>
<script src="site-v4.js?v=20261010c"></script>
<script src="odds-target-mode.js?v=20261010c"></script>
<script src="odds-independent.js?v=20261010i"></script>
<script src="odds-top-unified.js?v=20261010a"></script>
<script src="odds-target-all.js?v=20261010a"></script>
<script src="covers.js?v=20261010c"></script>
</body>
</html>
