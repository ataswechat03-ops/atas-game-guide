<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>ATAS 遊戲教學中心</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#090b10;color:#f5f7fb}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{border-right:1px solid #242935;padding:24px 18px;position:sticky;top:0;height:100vh;background:#0b0e14;overflow:auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#e1263f,#850d1f);display:grid;place-items:center;font-weight:900;font-size:22px}.brand b{display:block;font-size:18px}.brand small{color:#7f8795}.side-title{font-size:11px;color:#646d7b;font-weight:800;letter-spacing:.1em;margin:20px 8px 8px}.filter{width:100%;border:0;background:transparent;color:#b9c0cb;text-align:left;padding:10px 12px;border-radius:10px;margin:2px 0;font-weight:650}.filter:hover,.filter.active{background:#171b24;color:#fff}.filter.active{box-shadow:inset 3px 0 #e1263f}main{padding:28px clamp(18px,4vw,58px) 70px;min-width:0}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}header h1{font-size:24px;margin:0}header small{color:#747d8a}.hero{border:1px solid #242935;border-radius:22px;padding:34px;background:radial-gradient(circle at 85% 25%,rgba(225,38,63,.2),transparent 25%),linear-gradient(135deg,#171b24,#10131a);margin-bottom:20px}.hero .pill{display:inline-block;color:#f1c670;border:1px solid rgba(241,198,112,.25);border-radius:99px;padding:5px 9px;font-size:11px}.hero h2{font-size:clamp(28px,4vw,46px);margin:14px 0 10px}.hero p{color:#aeb5c0;line-height:1.8;max-width:720px;margin:0}.search{display:flex;gap:10px;margin:18px 0}.search input{flex:1;background:#11151c;border:1px solid #242935;border-radius:12px;color:#fff;padding:13px 14px;outline:none}.count{color:#7d8592;font-size:12px;display:flex;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid #242935;background:linear-gradient(180deg,#131720,#0f1218);border-radius:17px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#343b4b}.cover{height:135px;background:radial-gradient(circle at 70% 30%,rgba(225,38,63,.28),transparent 30%),linear-gradient(135deg,#242936,#141820);position:relative}.provider{position:absolute;left:12px;top:12px;padding:5px 8px;border-radius:99px;background:#0b0e14cc;border:1px solid #ffffff1c;font-size:10px;font-weight:800}.body{padding:15px}.meta{color:#7f8794;font-size:10px;margin-bottom:8px}.body h3{font-size:16px;margin:0 0 8px;line-height:1.4}.body p{font-size:12px;color:#9ba3af;line-height:1.7;min-height:42px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:9px;background:#1b202a;padding:4px 7px;border-radius:7px;color:#c4c9d2}.open{display:block;width:100%;border:0;border-top:1px solid #242935;background:transparent;color:#ff9ca8;padding:11px;font-weight:800}.overlay{position:fixed;inset:0;background:#000a;backdrop-filter:blur(5px);display:none;z-index:20}.panel{position:fixed;right:0;top:0;width:min(720px,100%);height:100vh;background:#10131a;border-left:1px solid #242935;z-index:30;overflow:auto;transform:translateX(100%);transition:.25s;padding:26px}.panel.open{transform:translateX(0)}.overlay.open{display:block}.close{float:right;width:36px;height:36px;border-radius:10px;border:1px solid #2a303d;background:#1a1f29;color:#fff;font-size:20px}.panel h2{font-size:29px;margin:22px 0 8px}.panel .summary{color:#aab1bc;line-height:1.8}.steps{display:grid;gap:12px;margin-top:25px}.step{display:grid;grid-template-columns:34px 1fr;gap:11px}.no{width:34px;height:34px;border-radius:10px;background:#e1263f22;color:#ff9aa6;display:grid;place-items:center;font-weight:900}.stepbox{background:#151923;border:1px solid #242935;border-radius:13px;padding:13px}.stepbox h4{margin:0 0 6px}.stepbox p{margin:0;color:#abb2bd;line-height:1.75;font-size:12px}.empty{padding:60px 20px;text-align:center;color:#808895}.menu{display:none}@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}aside{position:fixed;left:-270px;width:250px;z-index:50;transition:.2s}aside.open{left:0}main{padding:18px 15px 50px}.menu{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid #242935;border-radius:10px;background:#151923;color:#fff}header{justify-content:flex-start}.grid{grid-template-columns:1fr}.hero{padding:24px}}
</style>
</head>
<body>
<div class="app"><aside id="sidebar"><div class="brand"><div class="logo">A</div><div><b>ATAS</b><small>遊戲教學中心</small></div></div><div class="side-title">館別 / 遊戲商</div><div id="providers"></div><div class="side-title">分類</div><div id="categories"></div></aside><main><header><button class="menu" id="menu">☰</button><div><small>ATAS KNOWLEDGE BASE</small><h1>遊戲教學中心</h1></div></header><section class="hero"><span class="pill">集中管理・快速搜尋・分享即看</span><h2>找教學，不用再翻群組。</h2><p>按館別與分類快速找到需要的遊戲教學。把這個網址分享給同事，對方不用登入即可直接查看。</p></section><section class="search"><input id="q" placeholder="搜尋遊戲名稱、館別、玩法、標籤…"><div class="count" id="count"></div></section><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>目前找不到符合的教學。</div></main></div><div class="overlay" id="overlay"></div><section class="panel" id="panel"><button class="close" id="close">×</button><div id="detail"></div></section>
<script>
const data=[{"title":"虎虎來財｜Fortune Tiger","provider":"L365","category":"電子","summary":"快速認識虎虎來財的基本操作、投注與總贏取查看方式。","tags":["老虎","倍數","新手"],"steps":[["進入遊戲","從 ATAS 遊戲大廳進入 L365，搜尋「虎虎來財」並開啟遊戲。"],["設定投注","開始前先確認單局投注金額，再點擊旋轉。新手可先使用較低投注熟悉節奏。"],["查看獎勵","相同圖示形成有效連線時會獲得對應獎勵，部分情況可能出現額外倍率。"],["查看總贏取","每局結束後，可從畫面中的「總贏取」確認該局獲得的獎勵。"]]},{"title":"幸運三重｜Triple Fortune","provider":"ATG","category":"電子","summary":"三重玩法一次看懂：八方來財、集字樂與幸運獎。","tags":["刮刮樂","八方來財","集字樂"],"steps":[["第一重｜八方來財","當金貔貅倍率大於黑貔貅倍率時，獎金會再乘上金貔貅倍率。"],["第二重｜集字樂","刮出並集滿「八、方、來、財」四字，即可獲得對應獎勵。"],["第三重｜幸運獎","最後可繼續刮出獎金，或獲得「再來一張」等額外機會。"]]},{"title":"真人百家樂｜基本下注教學","provider":"DG","category":"真人","summary":"從選桌、下注到查看結果，快速掌握真人百家樂基本操作。","tags":["百家樂","莊","閒"],"steps":[["選擇桌台","進入 DG 真人後，選擇想加入的百家樂桌台。"],["確認下注區","主要下注區包含莊、閒與和局等。下注前請先確認桌台限紅與剩餘投注時間。"],["完成下注","選擇投注金額後點擊對應下注區，並在倒數結束前確認投注內容。"],["查看結果","開牌完成後系統會自動結算，可從餘額與遊戲紀錄查看結果。"]]},{"title":"足球｜歐洲盤快速入門","provider":"體育","category":"體育","summary":"用最簡單的方法理解 Decimal Odds 與基本回報計算。","tags":["足球","歐洲盤","賠率"],"steps":[["先看賠率","歐洲盤常見顯示方式如 1.90、2.10。數字代表包含本金在內的總回報倍率。"],["計算方式","例如投注 1,000，賠率 1.90，若全贏則總回報為 1,900。"],["注意贏半／輸半","遇到亞洲讓球盤的半輸半贏情況時，需要先把本金拆分後分別計算。"]]},{"title":"臺幣（TWD）線上充值","provider":"ATAS","category":"平台操作","summary":"說明完成手機綁定、實名認證後，如何使用臺幣線上充值。","tags":["TWD","充值","實名認證"],"steps":[["綁定手機號","先於平台完成手機號綁定。"],["完成實名認證","依照頁面提示提交實名認證資料並完成驗證。"],["進入充值","功能開放後，從股東端選擇臺幣線上充值，依照畫面指示完成操作。"]]}];
let provider='全部',category='全部';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function unique(k){return ['全部',...new Set(data.map(x=>x[k]))]}function nav(){$('#providers').innerHTML=unique('provider').map(x=>`<button class="filter ${provider===x?'active':''}" data-p="${esc(x)}">${esc(x)}</button>`).join('');$('#categories').innerHTML=unique('category').map(x=>`<button class="filter ${category===x?'active':''}" data-c="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{provider=b.dataset.p;nav();render();closeSide()});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{category=b.dataset.c;nav();render();closeSide()})}function filtered(){const q=$('#q').value.trim().toLowerCase();return data.filter(t=>(provider==='全部'||t.provider===provider)&&(category==='全部'||t.category===category)&&(!q||[t.title,t.provider,t.category,t.summary,(t.tags||[]).join(' '),...(t.steps||[]).flat()].join(' ').toLowerCase().includes(q)))}function render(){const list=filtered();$('#count').textContent=`共 ${list.length} 篇`;$('#empty').hidden=!!list.length;$('#grid').innerHTML=list.map(t=>`<article class="card"><div class="cover"><span class="provider">${esc(t.provider)}</span></div><div class="body"><div class="meta">${esc(t.category)} ・ ${t.steps.length} 個步驟</div><h3>${esc(t.title)}</h3><p>${esc(t.summary)}</p><div class="tags">${t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><button class="open" data-title="${esc(t.title)}">查看教學 →</button></article>`).join('');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openDetail(b.dataset.title))}function openDetail(title){const t=data.find(x=>x.title===title);if(!t)return;$('#detail').innerHTML=`<small>${esc(t.provider)} ・ ${esc(t.category)}</small><h2>${esc(t.title)}</h2><p class="summary">${esc(t.summary)}</p><div class="steps">${t.steps.map((s,i)=>`<div class="step"><div class="no">${i+1}</div><div class="stepbox"><h4>${esc(s[0])}</h4><p>${esc(s[1])}</p></div></div>`).join('')}</div>`;$('#panel').classList.add('open');$('#overlay').classList.add('open')}function closeDetail(){$('#panel').classList.remove('open');$('#overlay').classList.remove('open')}function closeSide(){$('#sidebar').classList.remove('open')}$('#q').oninput=render;$('#close').onclick=closeDetail;$('#overlay').onclick=()=>{closeDetail();closeSide()};$('#menu').onclick=()=>{$('#sidebar').classList.toggle('open');$('#overlay').classList.add('open')};nav();render();
</script></body></html>
