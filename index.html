<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div><b>ATAS</b><small>遊戲培訓中心</small></div>
    </div>
    <button class="mobile-close" id="mobileClose">×</button>
    <div class="side-title">分類</div>
    <nav id="categoryNav"></nav>
    <div class="side-title">快速進入</div>
    <nav id="guideNav"></nav>
  </aside>

  <main>
    <header>
      <div class="header-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div><div class="subhead">ATAS GAME TRAINING CENTER</div><h1>遊戲培訓中心</h1></div>
      </div>
    </header>

    <section class="hero">
      <span class="pill">ATAS GAME TRAINING CENTER</span>
      <h2>遊戲知識，一站學會。</h2>
      <p>從電子、真人到體育與各類遊戲教學，建立完整知識、實戰判斷與認證進度。需要學習或查資料，都能快速找到。</p>
      <div class="hero-stats" id="heroStats"></div>
    </section>

    <section class="toolbar">
      <label class="search"><span>⌕</span><input id="q" placeholder="搜尋：百家樂、骰寶、LINE、WAYS、足球、輪盤…"></label>
      <div class="count" id="count"></div>
    </section>

    <div class="section-title"><div class="subhead">TUTORIAL LIBRARY</div><h2 id="sectionTitle">全部教學</h2></div>
    <section class="guide-grid" id="guideGrid"></section>
    <div class="empty" id="empty">找不到符合的教學。</div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<section class="detail" id="detail">
  <div class="detail-head">
    <div><div class="subhead" id="detailCategory"></div><h2 id="detailTitle"></h2><p id="detailIntro"></p></div>
    <button class="close" id="closeDetail">×</button>
  </div>
  <div class="detail-body" id="detailBody"></div>
</section>
