<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>ATAS 遊戲教學中心</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#090b10;color:#f5f7fb}button,input{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{border-right:1px solid #242935;padding:24px 18px;background:#0b0e14;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#e1263f,#850d1f);display:grid;place-items:center;font-weight:900;font-size:22px}.brand b{display:block;font-size:18px}.brand small,.sub{color:#7f8795}.side-title{font-size:11px;color:#646d7b;font-weight:800;letter-spacing:.1em;margin:20px 8px 8px}.filter{width:100%;border:0;background:#171b24;color:#fff;text-align:left;padding:10px 12px;border-radius:10px;box-shadow:inset 3px 0 #e1263f}main{padding:28px clamp(18px,4vw,58px) 70px}header{margin-bottom:20px}header h1{font-size:24px;margin:0}.hero{border:1px solid #242935;border-radius:22px;padding:34px;background:radial-gradient(circle at 85% 25%,rgba(225,38,63,.2),transparent 25%),linear-gradient(135deg,#171b24,#10131a);margin-bottom:20px}.pill{display:inline-block;color:#f1c670;border:1px solid rgba(241,198,112,.25);border-radius:99px;padding:5px 9px;font-size:11px}.hero h2{font-size:clamp(28px,4vw,46px);margin:14px 0 10px}.hero p{color:#aeb5c0;line-height:1.8;max-width:720px;margin:0}.search{display:flex;gap:10px;margin:18px 0}.search input{flex:1;background:#11151c;border:1px solid #242935;border-radius:12px;color:#fff;padding:13px 14px;outline:none}.count{color:#7d8592;font-size:12px;display:flex;align-items:center}.empty{margin-top:18px;padding:70px 20px;text-align:center;border:1px dashed #2a303d;border-radius:18px;background:#0f1218}.empty .icon{font-size:38px;color:#59616d;margin-bottom:12px}.empty h3{margin:0 0 8px}.empty p{margin:0;color:#808895;line-height:1.7}.menu{display:none}@media(max-width:720px){.app{display:block}aside{display:none}main{padding:18px 15px 50px}.hero{padding:24px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo">A</div><div><b>ATAS</b><small>遊戲教學中心</small></div></div>
  <div class="side-title">館別 / 遊戲商</div><button class="filter">全部</button>
  <div class="side-title">分類</div><button class="filter">全部</button>
</aside>
<main>
  <header><div class="sub">ATAS KNOWLEDGE BASE</div><h1>遊戲教學中心</h1></header>
  <section class="hero"><span class="pill">集中管理・快速搜尋・分享即看</span><h2>找教學，不用再翻群組。</h2><p>按館別與分類快速找到需要的遊戲教學。把這個網址分享給同事，對方不用登入即可直接查看。</p></section>
  <section class="search"><input id="q" placeholder="搜尋遊戲名稱、館別、玩法、標籤…" disabled><div class="count">共 0 篇</div></section>
  <section class="empty"><div class="icon">＋</div><h3>目前尚未加入遊戲教學</h3><p>示範內容已全部清除。之後只放你真正要使用的遊戲教學。</p></section>
</main>
</div>
</body>
</html>
