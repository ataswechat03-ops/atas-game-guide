<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一世修仙｜Public Beta B5</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#eef2f7;font-family:system-ui,"Microsoft JhengHei",sans-serif}body{display:grid;place-items:center}.box{max-width:560px;padding:32px;text-align:center}.muted{color:#9ba8b8;font-size:14px;margin-top:10px}</style></head><body><div class="box"><h1>《一世修仙》</h1><div>Public Beta B5 載入中……</div><div id="msg" class="muted">正在讀取遊戲資料</div></div><script>(async()=>{try{const parts=["b5/part01.txt", "b5/part02.txt", "b5/part03c1.txt", "b5/part03c2.txt", "b5/part03c3.txt", "b5/part03c4.txt", "b5/part03c5.txt", "b5/part03c6.txt", "b5/part03c7.txt", "b5/part03c8.txt", "b5/part04.txt", "b5/part05.txt", "b5/part06.txt", "b5/part07.txt", "b5/part08.txt", "b5/part09.txt", "b5/part10.txt", "b5/part11.txt", "b5/part12.txt", "b5/part13.txt", "b5/part14.txt", "b5/part15.txt", "b5/part16.txt", "b5/part17.txt", "b5/part18.txt"];const text=(await Promise.all(parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p);return r.text()})))).join('').trim();const bin=Uint8Array.from(atob(text),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(err){document.getElementById('msg').textContent='載入失敗，請重新整理頁面。';console.error(err)}})();</script></body></html>
