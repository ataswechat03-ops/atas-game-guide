<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一世修仙 V1.0.3 Public Beta</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0d1117;color:#eef2f7;font-family:system-ui,"Microsoft JhengHei",sans-serif}body{display:grid;place-items:center}.box{max-width:560px;padding:32px;text-align:center}.muted{color:#9ba8b8;font-size:14px;margin-top:10px}
  </style>
</head>
<body>
  <div class="box"><h1>《一世修仙》</h1><div>Public Beta 載入中……</div><div id="msg" class="muted">正在讀取遊戲資料</div></div>
  <script>
  (async()=>{
    try{
      const parts=Array.from({length:7},(_,i)=>`data/part${String(i+1).padStart(2,'0')}.txt`);
      const text=(await Promise.all(parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p);return r.text()})))).join('').trim();
      const bin=Uint8Array.from(atob(text),c=>c.charCodeAt(0));
      const ds=new DecompressionStream('gzip');
      const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
      document.open();document.write(html);document.close();
    }catch(err){
      document.getElementById('msg').textContent='載入失敗，請重新整理頁面。';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
